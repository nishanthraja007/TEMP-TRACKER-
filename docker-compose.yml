services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atmo_track_app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - DATA_MODE=sample
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped
